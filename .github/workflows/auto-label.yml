name: Auto-label Issues

on:
  issues:
    types: [opened]

permissions:
  issues: write
  actions: write

jobs:
  auto-label:
    runs-on: ubuntu-latest
    steps:
      - name: Add ai-triage label to new issues
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['ai-triage']
            })

      - name: Auto-assign ai-implement and trigger pipeline
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = (issue.body || '').toLowerCase();
            const title = issue.title.toLowerCase();

            const implementKeywords = ['add', 'create', 'build', 'implement', 'fix', 'update', 'change', 'remove', 'refactor'];
            const hasKeyword = implementKeywords.some(kw => title.includes(kw) || body.includes(kw));

            if (hasKeyword) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['ai-implement']
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '🤖 Auto-labeled for AI implementation. Triggering pipeline...'
              });

              // Directly trigger the issue-to-pr workflow instead of relying on labeled event
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'issue-to-pr.yml',
                ref: 'master',
                inputs: {
                  issue_number: String(context.issue.number)
                }
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '🤖 This issue needs manual review. To trigger autonomous implementation, add the `ai-implement` label or comment `/implement`.'
              });
            }
