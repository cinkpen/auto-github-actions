name: Auto-Approve and Merge PRs

on:
  pull_request:
    types: [opened, synchronize]
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Auto-approve
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            console.log(`Approving PR #${pr.number}: ${pr.title}`);

            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });

            const alreadyApproved = reviews.data.some(
              r => r.user.login === 'github-actions[bot]' && r.state === 'APPROVED'
            );

            if (alreadyApproved) {
              console.log('Already approved, skipping.');
              return;
            }

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              event: 'APPROVE',
              body: '🤖 Auto-approved by the autonomous pipeline.'
            });

      - name: Auto-merge
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // Wait for approval to register
            await new Promise(r => setTimeout(r, 5000));

            // Check PR is mergeable
            const { data: freshPr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });

            if (!freshPr.mergeable) {
              console.log('PR not mergeable yet, will retry on next push.');
              return;
            }

            // Enable auto-merge (merge commit)
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              commit_title: `${freshPr.title} (#${freshPr.number})`,
              commit_message: '🤖 Auto-merged by the autonomous pipeline.',
              merge_method: 'merge'
            });

            console.log(`Merged PR #${pr.number}`);
