name: Issue to PR (Autonomous)

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to implement"
        required: true
        type: number

concurrency:
  group: claude-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  autonomous-implement:
    runs-on: ubuntu-latest
    # Only run when triggered by:
    # 1. An issue event with ai-implement label, OR
    # 2. A comment starting with /implement, OR
    # 3. Manual workflow dispatch
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'ai-implement')) ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/implement'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Get issue details
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue?.number || context.payload.workflow_dispatch?.inputs?.issue_number || ${{ inputs.issue_number || 0 }};
            if (!issueNumber) {
              core.setFailed('No issue number found');
              return;
            }
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });
            core.setOutput('number', issueNumber);
            core.setOutput('title', issue.title);
            core.setOutput('body', issue.body || '');

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-sonnet-4-20250514
          max_turns: 30
          prompt: |
            You are an autonomous developer. Your task is to implement the changes described in GitHub issue #${{ steps.issue.outputs.number }}.

            ## Issue Details
            Title: ${{ steps.issue.outputs.title }}
            Body: ${{ steps.issue.outputs.body }}

            ## Instructions
            1. Read the issue carefully and understand what needs to be done.
            2. Read CLAUDE.md in the repo root for project conventions.
            3. Implement the changes — write clean, production-quality code.
            4. If the issue is ambiguous, make reasonable decisions and document them.
            5. Run `npm run build` to verify your changes compile.
            6. Commit your changes to a new branch named `ai/issue-${{ steps.issue.outputs.number }}`.
            7. Create a pull request that:
               - References the issue with "Closes #${{ steps.issue.outputs.number }}"
               - Summarizes what was implemented
               - Lists any decisions made or assumptions taken
          use_sticky_comment: true
